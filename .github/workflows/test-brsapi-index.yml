name: Daily BRSAPI Index Archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-brsapi-index.yml
  workflow_dispatch:
  schedule:
    # Run once daily at 18:00 Tehran time (14:30 UTC), after market close.
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  group: daily-brsapi-index
  cancel-in-progress: false

jobs:
  fetch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Iran market calendar
        id: market-day
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def gregorian_to_jalali(gy, gm, gd):
              month_days = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334]
              if gy > 1600:
                  jy = 979
                  gy -= 1600
              else:
                  jy = 0
                  gy -= 621

              gy2 = gy + 1 if gm > 2 else gy
              days = (
                  365 * gy
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
                  - 80
                  + gd
                  + month_days[gm - 1]
              )

              jy += 33 * (days // 12053)
              days %= 12053
              jy += 4 * (days // 1461)
              days %= 1461

              if days > 365:
                  jy += (days - 1) // 365
                  days = (days - 1) % 365

              if days < 186:
                  jm = 1 + days // 31
                  jd = 1 + days % 31
              else:
                  jm = 7 + (days - 186) // 30
                  jd = 1 + (days - 186) % 30

              return jy, jm, jd

          now = datetime.now(ZoneInfo("Asia/Tehran"))
          jy, jm, jd = gregorian_to_jalali(now.year, now.month, now.day)
          jalali_date = f"{jy:04d}-{jm:02d}-{jd:02d}"

          should_run = True
          reason = "Trading day"

          if now.weekday() in (3, 4):
              should_run = False
              reason = "Thursday/Friday weekend in Iran"
          else:
              calendar_path = Path(f"calendar/holidays-{jy}.json")
              if not calendar_path.exists():
                  should_run = False
                  reason = f"Holiday calendar for Jalali year {jy} is not configured"
              else:
                  calendar = json.loads(calendar_path.read_text(encoding="utf-8"))
                  if jy != calendar.get("year"):
                      should_run = False
                      reason = f"Calendar year mismatch for {jalali_date}"
                  elif jalali_date in set(calendar.get("holidays", [])):
                      should_run = False
                      reason = "Official Iranian public holiday"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")

          print(f"Tehran date: {jalali_date}")
          print(f"Decision: {'FETCH' if should_run else 'SKIP'}")
          print(f"Reason: {reason}")
          if not should_run:
              print(f"::notice::{reason}")
          PY

      - name: Fetch market index JSON
        if: steps.market-day.outputs.run == 'true'
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BRSAPI_KEY:-}" ]; then
            echo "::error::Missing repository secret BRSAPI_KEY"
            exit 1
          fi

          mkdir -p output
          http_status=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --retry 2 --retry-delay 2 \
            --get 'https://api.brsapi.ir/Tsetmc/Index.php' \
            --data-urlencode "key=${BRSAPI_KEY}" \
            --data-urlencode "type=1" \
            --output output/index.json \
            --write-out '%{http_code}')

          echo "HTTP status: ${http_status}"
          if [ "${http_status}" != "200" ]; then
            echo "::error::BRSAPI returned HTTP ${http_status}"
            python - <<'PY'
          import os
          from pathlib import Path

          path = Path("output/index.json")
          body = path.read_bytes() if path.exists() else b""
          key = os.environ.get("BRSAPI_KEY", "").encode()
          if key:
              body = body.replace(key, b"[REDACTED]")
          safe_body = body.decode("utf-8", errors="replace")
          print("Sanitized response body (first 4000 characters):")
          print(safe_body[:4000] if safe_body else "[empty response body]")
          path.write_text(safe_body, encoding="utf-8")
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/index.json")
          data = json.loads(path.read_text(encoding="utf-8-sig"))

          if not isinstance(data, dict):
              raise SystemExit("Expected the BRSAPI response to be a JSON object.")

          print("JSON response received and parsed successfully.")
          print("Top-level fields:", ", ".join(data.keys()))
          for key in (
              "date", "time", "state", "index", "index_change",
              "index_equalWeight", "index_equalWeight_change",
              "mv", "tno", "tval", "tvol"
          ):
              if key in data:
                  print(f"{key}: {data[key]}")
          print("Response size:", path.stat().st_size, "bytes")
          PY

      - name: Check for unchanged or duplicate market data
        id: archive
        if: steps.market-day.outputs.run == 'true' && success()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path("output/index.json")
          data = json.loads(source.read_text(encoding="utf-8-sig"))

          if not isinstance(data, dict):
              raise SystemExit("Cannot archive response: expected a JSON object.")

          api_date = data.get("date")
          if not isinstance(api_date, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", api_date):
              raise SystemExit(f"Cannot archive response: unexpected API date: {api_date!r}")

          archive_dir = Path("archive")
          archive_dir.mkdir(parents=True, exist_ok=True)
          destination = archive_dir / f"index-{api_date}.json"
          previous_files = sorted(archive_dir.glob("index-*.json"))

          canonical_data = json.dumps(
              data, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          )

          if destination.exists():
              reason = f"Duplicate API date {api_date}; no new archive record created."
              created = False
          elif previous_files:
              latest_file = previous_files[-1]
              previous_data = json.loads(latest_file.read_text(encoding="utf-8-sig"))
              canonical_previous = json.dumps(
                  previous_data, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              )

              content_matches_previous = canonical_data == canonical_previous
              destination.write_bytes(source.read_bytes())
              if content_matches_previous:
                  reason = (
                      f"New API date {api_date} archived as {destination}. "
                      f"All JSON fields match {latest_file.name}; date remains the unique record key."
                  )
              else:
                  reason = f"New market data archived as {destination}."
              created = True
          else:
              destination.write_bytes(source.read_bytes())
              reason = f"First market data record archived as {destination}."
              created = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"created={'true' if created else 'false'}\n")

          print(reason)
          PY

      - name: Commit new daily archive
        if: steps.market-day.outputs.run == 'true' && steps.archive.outputs.created == 'true'
        run: |
          set -euo pipefail
          git add archive/
          if git diff --cached --quiet; then
            echo "No new archive file to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive BRSAPI index data"
          git push

      - name: Save API response artifact
        if: steps.market-day.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: brsapi-index-result
          path: output/index.json
          if-no-files-found: ignore
          retention-days: 3
