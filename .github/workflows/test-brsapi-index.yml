name: Daily BRSAPI Index Archive

on:
  workflow_dispatch:
  schedule:
    # Saturday through Wednesday in Iran, 18:00 Tehran time (14:30 UTC).
    - cron: "30 14 * * 0-3,6"

permissions:
  contents: write

concurrency:
  group: daily-brsapi-index
  cancel-in-progress: false

jobs:
  fetch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch market index JSON
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BRSAPI_KEY:-}" ]; then
            echo "::error::Missing repository secret BRSAPI_KEY"
            exit 1
          fi

          mkdir -p output
          http_status=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --retry 2 --retry-delay 2 \
            --get 'https://api.brsapi.ir/Tsetmc/Index.php' \
            --data-urlencode "key=${BRSAPI_KEY}" \
            --data-urlencode "type=1" \
            --output output/index.json \
            --write-out '%{http_code}')

          echo "HTTP status: ${http_status}"
          if [ "${http_status}" != "200" ]; then
            echo "::error::BRSAPI returned HTTP ${http_status}"
            python - <<'PY'
          import os
          from pathlib import Path

          path = Path("output/index.json")
          body = path.read_bytes() if path.exists() else b""
          key = os.environ.get("BRSAPI_KEY", "").encode()
          if key:
              body = body.replace(key, b"[REDACTED]")
          safe_body = body.decode("utf-8", errors="replace")
          print("Sanitized response body (first 4000 characters):")
          print(safe_body[:4000] if safe_body else "[empty response body]")
          path.write_text(safe_body, encoding="utf-8")
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/index.json")
          data = json.loads(path.read_text(encoding="utf-8-sig"))

          if not isinstance(data, dict):
              raise SystemExit("Expected the BRSAPI response to be a JSON object.")

          print("JSON response received and parsed successfully.")
          print("Top-level fields:", ", ".join(data.keys()))
          for key in (
              "date", "time", "state", "index", "index_change",
              "index_equalWeight", "index_equalWeight_change",
              "mv", "tno", "tval", "tvol"
          ):
              if key in data:
                  print(f"{key}: {data[key]}")
          print("Response size:", path.stat().st_size, "bytes")
          PY

      - name: Check for unchanged or duplicate market data
        id: archive
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path("output/index.json")
          data = json.loads(source.read_text(encoding="utf-8-sig"))

          if not isinstance(data, dict):
              raise SystemExit("Cannot archive response: expected a JSON object.")

          api_date = data.get("date")
          if not isinstance(api_date, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", api_date):
              raise SystemExit(f"Cannot archive response: unexpected API date: {api_date!r}")

          archive_dir = Path("archive")
          archive_dir.mkdir(parents=True, exist_ok=True)
          destination = archive_dir / f"index-{api_date}.json"
          previous_files = sorted(archive_dir.glob("index-*.json"))

          if destination.exists():
              reason = f"Duplicate API date {api_date}; no new archive record created."
              created = False
          elif previous_files:
              latest_file = previous_files[-1]
              previous_data = json.loads(latest_file.read_text(encoding="utf-8-sig"))

              if data == previous_data:
                  reason = (
                      f"API response is identical to the latest archived data "
                      f"({latest_file.name}); likely a market-closed day. "
                      "No new archive record created."
                  )
                  created = False
              else:
                  destination.write_bytes(source.read_bytes())
                  reason = f"New market data archived as {destination}."
                  created = True
          else:
              destination.write_bytes(source.read_bytes())
              reason = f"First market data record archived as {destination}."
              created = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"created={'true' if created else 'false'}\n")

          print(reason)
          PY

      - name: Commit new daily archive
        if: steps.archive.outputs.created == 'true'
        run: |
          set -euo pipefail
          git add archive/
          if git diff --cached --quiet; then
            echo "No new archive file to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive BRSAPI index data"
          git push

      - name: Save API response artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brsapi-index-result
          path: output/index.json
          if-no-files-found: ignore
          retention-days: 3
