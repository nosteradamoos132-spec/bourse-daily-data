name: Daily TSETMC MarketWatch Download

on:
  push:
    branches: [main]
    paths:
      - "triggers/daily.txt"
      - "triggers/marketwatch-test.txt"

permissions:
  contents: read

concurrency:
  group: daily-marketwatch-download
  cancel-in-progress: false

jobs:
  download-marketwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Iran trading calendar
        id: market-day
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def gregorian_to_jalali(gy, gm, gd):
              month_days = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334]
              if gy > 1600:
                  jy = 979
                  gy -= 1600
              else:
                  jy = 0
                  gy -= 621
              gy2 = gy + 1 if gm > 2 else gy
              days = (
                  365 * gy
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
                  - 80
                  + gd
                  + month_days[gm - 1]
              )
              jy += 33 * (days // 12053)
              days %= 12053
              jy += 4 * (days // 1461)
              days %= 1461
              if days > 365:
                  jy += (days - 1) // 365
                  days = (days - 1) % 365
              if days < 186:
                  jm = 1 + days // 31
                  jd = 1 + days % 31
              else:
                  jm = 7 + (days - 186) // 30
                  jd = 1 + (days - 186) % 30
              return jy, jm, jd

          now = datetime.now(ZoneInfo("Asia/Tehran"))
          jy, jm, jd = gregorian_to_jalali(now.year, now.month, now.day)
          jalali_date = f"{jy:04d}-{jm:02d}-{jd:02d}"

          should_run = now.weekday() != 4
          reason = "Trading day" if should_run else "Friday weekend in Iran"

          if should_run:
              calendar_path = Path(f"calendar/holidays-{jy}.json")
              if not calendar_path.exists():
                  raise SystemExit(f"Holiday calendar is missing: {calendar_path}")
              calendar = json.loads(calendar_path.read_text(encoding="utf-8"))
              if calendar.get("year") != jy:
                  raise SystemExit(f"Holiday calendar year mismatch for {jalali_date}")
              if jalali_date in set(calendar.get("holidays", [])):
                  should_run = False
                  reason = "Official Iranian public holiday"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
              output.write(f"jalali_date={jalali_date}\n")

          print(f"Tehran date: {jalali_date}")
          print(f"Decision: {'DOWNLOAD' if should_run else 'SKIP'}")
          print(f"Reason: {reason}")
          PY

      - name: Download the complete TSETMC MarketWatch Excel file
        if: steps.market-day.outputs.run == 'true'
        env:
          JALALI_DATE: ${{ steps.market-day.outputs.jalali_date }}
        run: |
          python - <<'PY'
          import hashlib
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          source_url = "http://members.tsetmc.com/tsev2/excel/MarketWatchPlus.aspx?d=0"
          output_dir = Path("marketwatch-download")
          output_dir.mkdir(parents=True, exist_ok=True)
          jalali_date = os.environ["JALALI_DATE"]
          destination = output_dir / f"MarketWatchPlus-{jalali_date}.xls"

          max_attempts = 12
          wait_seconds = 60
          last_error = None

          for attempt in range(1, max_attempts + 1):
              try:
                  request = Request(
                      source_url,
                      headers={
                          "Accept": "application/vnd.ms-excel, application/octet-stream, */*",
                          "User-Agent": "Mozilla/5.0 (compatible; BourseDailyArchive/1.0)",
                          "Cache-Control": "no-cache",
                      },
                      method="GET",
                  )

                  with urlopen(request, timeout=180) as response:
                      status = response.status
                      body = response.read()
                      content_type = response.headers.get("Content-Type", "")
                      content_disposition = response.headers.get("Content-Disposition", "")

                  if status != 200:
                      raise RuntimeError(f"Unexpected HTTP status {status}")

                  if len(body) < 256:
                      raise RuntimeError(f"Response too small: {len(body)} bytes")

                  prefix = body[:8192].lstrip().lower()
                  signature_ok = (
                      body.startswith(bytes.fromhex("D0CF11E0A1B11AE1"))
                      or body.startswith(b"PK\\x03\\x04")
                      or b"<workbook" in prefix
                      or (
                          b"<html" in prefix
                          and ".xls" in content_disposition.lower()
                          and "excel" in content_type.lower()
                      )
                  )

                  if not signature_ok:
                      sample = prefix[:100].decode("ascii", errors="replace")
                      raise RuntimeError(
                          "Response does not look like an Excel file. "
                          f"Content-Type={content_type!r}; sample={sample!r}"
                      )

                  destination.write_bytes(body)
                  digest = hashlib.sha256(body).hexdigest()

                  print(f"DOWNLOAD SUCCESS on attempt {attempt}")
                  print(f"File: {destination.name}")
                  print(f"Bytes received: {len(body)}")
                  print(f"Content-Type: {content_type or 'not supplied'}")
                  print(f"Content-Disposition: {content_disposition or 'not supplied'}")
                  print(f"First 8 bytes: {body[:8].hex()}")
                  print(f"SHA256: {digest}")
                  print("The complete response body was read before success was reported.")
                  break

              except (HTTPError, URLError, TimeoutError, RuntimeError, OSError) as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(f"Attempt {attempt}/{max_attempts} failed: {last_error}")

                  if attempt == max_attempts:
                      raise SystemExit(
                          f"MarketWatch Excel download failed after {max_attempts} attempts. "
                          f"Last error: {last_error}"
                      ) from None

                  print(f"Waiting {wait_seconds} seconds before the next attempt.")
                  time.sleep(wait_seconds)
          PY
