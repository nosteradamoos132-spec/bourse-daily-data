name: Temporary Market Report Retry Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-retry-report.yml

permissions:
  contents: write

concurrency:
  group: market-report-retry-test
  cancel-in-progress: false

jobs:
  poll-market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Wait five minutes before the first request
        run: sleep 300

      - name: Retry until today's closed report is received
        id: poll
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BRSAPI_KEY:-}" ]; then
            echo "::error::Missing repository secret BRSAPI_KEY"
            exit 1
          fi

          python - <<'PY'
          import json
          import math
          import os
          import sys
          import time
          from datetime import datetime
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          def gregorian_to_jalali(gy, gm, gd):
              month_days = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334]
              if gy > 1600:
                  jy = 979
                  gy -= 1600
              else:
                  jy = 0
                  gy -= 621
              gy2 = gy + 1 if gm > 2 else gy
              days = (
                  365 * gy
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
                  - 80
                  + gd
                  + month_days[gm - 1]
              )
              jy += 33 * (days // 12053)
              days %= 12053
              jy += 4 * (days // 1461)
              days %= 1461
              if days > 365:
                  jy += (days - 1) // 365
                  days = (days - 1) % 365
              if days < 186:
                  jm = 1 + days // 31
                  jd = 1 + days % 31
              else:
                  jm = 7 + (days - 186) // 30
                  jd = 1 + (days - 186) % 30
              return jy, jm, jd

          now = datetime.now(ZoneInfo("Asia/Tehran"))
          jy, jm, jd = gregorian_to_jalali(now.year, now.month, now.day)
          target_date = f"{jy:04d}-{jm:02d}-{jd:02d}"
          print(f"Target market date: {target_date}")
          print("Retry interval: 5 minutes")
          print("A report is accepted only when its date is today and state is بسته.")

          required_numeric = (
              "index", "index_change", "index_equalWeight",
              "index_equalWeight_change", "mv", "tno", "tval", "tvol"
          )
          query = urlencode({"key": os.environ["BRSAPI_KEY"], "type": "1"})
          url = "https://api.brsapi.ir/Tsetmc/Index.php?" + query
          deadline = time.monotonic() + (5 * 60 * 60 + 45 * 60)
          attempt = 0

          while time.monotonic() < deadline:
              attempt += 1
              local_now = datetime.now(ZoneInfo("Asia/Tehran")).strftime("%Y-%m-%d %H:%M:%S")
              print(f"Attempt {attempt} at Tehran time {local_now}")

              try:
                  request = Request(url, headers={"User-Agent": "BourseDailyArchiveRetryTest/1.0"})
                  with urlopen(request, timeout=60) as response:
                      raw = response.read()
                      if response.status != 200:
                          print(f"API returned HTTP {response.status}; retrying.")
                          data = None
                      else:
                          data = json.loads(raw.decode("utf-8-sig"))

                  if isinstance(data, dict):
                      missing = [
                          key for key in ("date", "time", "state", *required_numeric)
                          if key not in data
                      ]
                      invalid_numeric = [
                          key for key in required_numeric
                          if key in data and (
                              isinstance(data[key], bool)
                              or not isinstance(data[key], (int, float))
                              or not math.isfinite(float(data[key]))
                          )
                      ]
                      date_matches = data.get("date") == target_date
                      market_closed = str(data.get("state", "")).strip() == "بسته"

                      print(
                          f"API date={data.get('date')!r}, "
                          f"time={data.get('time')!r}, state={data.get('state')!r}"
                      )

                      if date_matches and market_closed and not missing and not invalid_numeric:
                          output_dir = Path("output")
                          archive_dir = Path("archive")
                          output_dir.mkdir(exist_ok=True)
                          archive_dir.mkdir(exist_ok=True)
                          output_file = output_dir / "index.json"
                          archive_file = archive_dir / f"index-{target_date}.json"

                          output_file.write_bytes(raw)
                          changed = not archive_file.exists() or (
                              json.loads(archive_file.read_text(encoding="utf-8-sig")) != data
                          )
                          if changed:
                              archive_file.write_bytes(raw)
                              print(f"Accepted report saved to {archive_file}.")
                          else:
                              print(f"Today's report already exists unchanged at {archive_file}.")

                          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                              output.write("report_ready=true\n")
                              output.write(f"report_date={target_date}\n")
                              output.write(f"archive_changed={'true' if changed else 'false'}\n")
                          print("VALID CLOSED REPORT RECEIVED. Stopping retry loop.")
                          sys.exit(0)

                      reasons = []
                      if not date_matches:
                          reasons.append("API date is not today's market date")
                      if not market_closed:
                          reasons.append("market is not marked as بسته")
                      if missing:
                          reasons.append("missing fields: " + ", ".join(missing))
                      if invalid_numeric:
                          reasons.append("non-numeric fields: " + ", ".join(invalid_numeric))
                      print("Report not ready: " + "; ".join(reasons))

                  else:
                      print("API response is not a JSON object; retrying.")

              except HTTPError as error:
                  print(f"API HTTP error {error.code}; retrying.")
              except (URLError, TimeoutError, OSError) as error:
                  print(f"Network error ({type(error).__name__}); retrying.")
              except (json.JSONDecodeError, UnicodeDecodeError, ValueError) as error:
                  print(f"Invalid API response ({type(error).__name__}); retrying.")

              if time.monotonic() + 300 >= deadline:
                  break
              print("Waiting 5 minutes before the next request.")
              time.sleep(300)

          print("::error::No valid closed report was received within the 6-hour GitHub job limit.")
          raise SystemExit(1)
          PY

      - name: Save the received report as an artifact
        if: steps.poll.outputs.report_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: market-report-retry-test
          path: output/index.json
          retention-days: 3

      - name: Archive report and remove this one-time test workflow
        if: steps.poll.outputs.report_ready == 'true'
        run: |
          set -euo pipefail
          git add "archive/index-${{ steps.poll.outputs.report_date }}.json"
          git rm .github/workflows/test-retry-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive closed market report and finish retry test"
          git push
