name: Daily BRSAPI and Excel Engine

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: daily-bourse-engine
  cancel-in-progress: false

jobs:
  run-engine:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1 &&
      github.event.comment.user.login == 'nosteradamoos132-spec' &&
      startsWith(github.event.comment.body, '/assistant-manual-bourse ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the main branch for durable state commits
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: python -m py_compile scripts/daily_bourse_engine.py tests/test_daily_bourse_engine.py

      - name: Test Tehran schedule and calendar rules
        run: python -m unittest discover -s tests -v

      - name: Run the Tehran-time engine
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTOR: ${{ github.event.comment.user.login }}
          MANUAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          MANUAL_COMMAND: ${{ github.event.comment.body }}
        run: python scripts/daily_bourse_engine.py
