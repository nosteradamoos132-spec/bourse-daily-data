name: GitHub External Trigger Test

on:
  push:
    paths:
      - "triggers/daily.txt"

permissions: {}

jobs:
  verify-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm the external daily trigger started this workflow
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Started at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "${GITHUB_EVENT_NAME}" = "push"
