name: Automatic BRSAPI Report Test

on:
  schedule:
    # Poll every five minutes; a UTC guard prevents any run before the requested start time.
    - cron: "3-58/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-brsapi-report-test
  cancel-in-progress: false

jobs:
  fetch-report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait until the requested first-run time and enforce five-minute retries
        id: schedule
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          first_run = datetime.fromisoformat("2026-11-04T19:37:18+00:00")
          now = datetime.now(timezone.utc)
          elapsed = (now - first_run).total_seconds()

          # Cron runs every five minutes. Permit only the first minute of each
          # five-minute window, beginning at the requested first-run timestamp.
          due = elapsed >= 0 and int(elapsed) % 300 < 60

          print(f"Current UTC time: {now.isoformat()}")
          print(f"Requested start UTC: {first_run.isoformat()}")
          print(f"Elapsed seconds: {elapsed:.1f}")
          print(f"Run now: {due}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if due else 'false'}\n")
          PY

      - name: Request report and check whether it is ready or duplicated
        id: report
        if: steps.schedule.outputs.run == 'true'
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${BRSAPI_KEY:-}" ]; then
            echo "::error::Missing repository secret BRSAPI_KEY"
            exit 1
          fi

          mkdir -p output archive

          # Retry transient API/network failures up to two additional times.
          curl --silent --show-error --fail --location \
            --connect-timeout 15 --max-time 40 \
            --retry 2 --retry-all-errors --retry-delay 3 \
            --get 'https://api.brsapi.ir/Tsetmc/Index.php' \
            --data-urlencode "key=${BRSAPI_KEY}" \
            --data-urlencode "type=1" \
            --output output/index.json

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path("output/index.json")
          data = json.loads(source.read_text(encoding="utf-8-sig"))

          if not isinstance(data, dict):
              raise SystemExit("API response is not a JSON object.")

          api_date = data.get("date")
          if not isinstance(api_date, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", api_date):
              raise SystemExit(f"Invalid or missing report date: {api_date!r}")

          state = data.get("state")
          print(f"Report date: {api_date}")
          print(f"Market state: {state!r}")

          if state != "بسته":
              print("Report is not final yet; the next scheduled retry will check again.")
              finish = False
              created = False
              result = "not_ready"
          else:
              destination = Path("archive") / f"index-{api_date}.json"
              if destination.exists():
                  print(f"Duplicate report: {destination} already exists. No new file will be saved.")
                  finish = True
                  created = False
                  result = "duplicate"
              else:
                  destination.write_bytes(source.read_bytes())
                  print(f"New final report saved to {destination}.")
                  finish = True
                  created = True
                  result = "saved"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"finish={'true' if finish else 'false'}\n")
              output.write(f"created={'true' if created else 'false'}\n")
              output.write(f"result={result}\n")
          PY

      - name: Commit the new report
        if: steps.schedule.outputs.run == 'true' && steps.report.outputs.created == 'true'
        run: |
          set -euo pipefail
          git add archive/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive BRSAPI report"
          git push

      - name: Stop future scheduled retries after receiving a final report
        if: steps.schedule.outputs.run == 'true' && steps.report.outputs.finish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/disable-response.json \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/automatic-brsapi-report.yml/disable")

          if [ "${status}" != "204" ]; then
            echo "::error::Could not disable scheduled retries (HTTP ${status})."
            cat /tmp/disable-response.json
            exit 1
          fi

          echo "Final report handled (${{ steps.report.outputs.result }}). Future scheduled retries are disabled."
