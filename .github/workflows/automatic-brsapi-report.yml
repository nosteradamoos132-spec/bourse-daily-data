name: GitHub Schedule Trigger Test

on:
  schedule:
    # Diagnostic only: run every five minutes, away from the top of the hour.
    - cron: "2-59/5 * * * *"

permissions: {}

jobs:
  verify-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub started this workflow automatically
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Started at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test "${GITHUB_EVENT_NAME}" = "schedule"
